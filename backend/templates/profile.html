{% extends "layout.html" %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h2>User Profile</h2>
        
        <div class="form-group">
            <label>Username</label>
            <input type="text" value="{{ g.user.username }}" readonly>
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" value="{{ g.user.email }}" readonly>
        </div>

        <div class="form-group">
            <label>Account Type</label>
            <input type="text" value="{% if g.user.is_admin %}Admin{% else %}Standard User{% endif %}" readonly>
        </div>

        <a href="{{ url_for('auth.logout') }}" class="btn-primary" style="display:block; text-align:center; text-decoration:none; background:#ef4444;">Log Out</a>
    </div>
</div>
{% endblock %}
